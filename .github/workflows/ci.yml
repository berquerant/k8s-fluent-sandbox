name: CI

permissions: {}

on:
  push:
    branches:
      - main
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    permissions:
      contents: read
    uses: berquerant/reusable-workflows/.github/workflows/helm-chart-ci.yml@v0.10.1
    with:
      chart-dir: charts/fluent-sandbox

  actions-lock-verify:
    permissions:
      contents: read
    uses: berquerant/reusable-workflows/.github/workflows/actions-lock-verify.yml@v0.10.1
