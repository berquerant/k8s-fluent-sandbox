name: CI

permissions: {}

on:
  push:
    branches:
      - main
  pull_request:

env:
  CHART_NAME: charts/fluent-sandbox

jobs:
  build:
    name: Run
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Set up chart-testing
        uses: helm/chart-testing-action@v2.9.0
      - name: Set up Helm
        uses: azure/setup-helm@v5.0.1

      - name: Run helm lint
        uses: WyriHaximus/github-action-helm3@v4.0.2
        with:
          exec: helm lint --strict "$CHART_NAME"

      - name: Run chart-testing (lint)
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: ct lint --charts "$CHART_NAME" --target-branch $TARGET_BRANCH

      - name: Create kind cluster
        uses: helm/kind-action@v1.15.2

      - name: Run chart-testing (install)
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: ct install --charts "$CHART_NAME" --target-branch $TARGET_BRANCH
