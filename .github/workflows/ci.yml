name: CI

permissions: {}

on:
  push:
    branches:
      - main
  pull_request:

env:
  CHART_NAME: charts/fluent-sandbox

jobs:
  build:
    name: Run
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up chart-testing
        uses: helm/chart-testing-action@6ec842c01de15ebb84c8627d2744a0c2f2755c9f # v2.8.0
      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1

      - name: Run helm lint
        uses: WyriHaximus/github-action-helm3@e3894d973c282349e3d41d3347767f2b2545b583 # v4.0.2
        with:
          exec: helm lint --strict "$CHART_NAME"

      - name: Run chart-testing (lint)
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: ct lint --charts "$CHART_NAME" --target-branch $TARGET_BRANCH

      - name: Create kind cluster
        uses: helm/kind-action@06c1ae10762d3b9c1644e7fe69596ae519e015a2 # v1.15.0

      - name: Run chart-testing (install)
        env:
          TARGET_BRANCH: ${{ github.event.repository.default_branch }}
        run: ct install --charts "$CHART_NAME" --target-branch $TARGET_BRANCH
