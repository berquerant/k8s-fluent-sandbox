name: Release

permissions: {}

on:
  push:
    branches:
      - main
    paths:
      - 'charts/**'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    permissions:
      contents: write
      packages: write
    uses: berquerant/reusable-workflows/.github/workflows/helm-chart-release.yml@v0.2.1
    with:
      helm-version: v4.3.2
